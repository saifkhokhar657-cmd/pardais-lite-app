name: Pardais Lite Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Remove legacy AppDeploy backend files
        run: rm -f backend/index.ts backend/pardais.ts backend/realtime-subscribers.ts backend/realtime.ts
      - run: npm run build
